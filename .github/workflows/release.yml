name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, such as 0.1.0'
        required: true

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.record.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Validate version
        run: |
          $version = '${{ inputs.version }}'
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Version '$version' must look like 1.2.3" }
          if (git tag --list "v$version") { throw "Tag v$version already exists" }
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: ./build-and-test.cmd
      - name: Record version
        id: record
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sed -b -i "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>$VERSION</VersionPrefix>|" EverQuestLogWatcher/EverQuestLogWatcher.csproj
          if ! git diff --quiet; then
            git config user.name "Github Actions"
            git config user.email actions@github.com
            git commit -am ". r Release $VERSION"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  publish:
    needs: validate
    uses: ./.github/workflows/_publish.yml
    permissions:
      id-token: write
      contents: write
    secrets: inherit
    with:
      version-property: Version=${{ inputs.version }}
      github-release: true
      ref: ${{ needs.validate.outputs.sha }}

  bump-version:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - name: Set VersionPrefix to the next patch version
        env:
          RELEASED: ${{ inputs.version }}
        run: |
          IFS=. read -r major minor patch <<< "$RELEASED"
          next="$major.$minor.$((10#$patch + 1))"
          sed -i "s|<VersionPrefix>.*</VersionPrefix>|<VersionPrefix>$next</VersionPrefix>|" EverQuestLogWatcher/EverQuestLogWatcher.csproj
          git config user.name "Github Actions"
          git config user.email actions@github.com
          git commit -am ". r Bump version to $next after releasing $RELEASED"
          git pull --rebase
          git push
