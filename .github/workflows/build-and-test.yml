name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: '38 9 * * 3'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: ./build-and-test.cmd

  publish-prerelease:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build Release
        run: dotnet build EverQuestLogWatcher.slnx -c Release -p:VersionSuffix="ci.${{ github.run_number }}"
      - name: Pack prerelease
        run: dotnet pack EverQuestLogWatcher.slnx -c Release -p:VersionSuffix="ci.${{ github.run_number }}" -o ./artifacts --no-build
      - name: NuGet Login
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts\*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
      - name: Tag release
        run: |
          $VERSION = (Get-ChildItem ./artifacts/EverQuestLogWatcher.[0-9]*.nupkg | Select-Object -First 1).BaseName -replace '^EverQuestLogWatcher\.', ''
          git tag "v$VERSION"
          git push origin "v$VERSION"

  dependabot-auto-merge:
    needs: build
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]' && github.repository == 'JayPNW/EverquestLogWatcher'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge
        run: gh pr merge --auto --rebase "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

